name: dsp
on:
  push:
    paths: ["dsp/**", "music.json", ".github/workflows/dsp.yml"]
  pull_request:
    paths: ["dsp/**", "music.json"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dsp
      - run: cargo test --release --manifest-path dsp/Cargo.toml
