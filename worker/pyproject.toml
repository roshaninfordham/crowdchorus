[project]
name = "worker"
version = "0.1.0"
description = "CrowdChorus generation worker: brief, art, music, mix, analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "google-genai>=2.3.0",
    "httpx>=0.27",
    "pillow>=10.4",
    "snowflake-connector-python>=3.12",
    "sentry-sdk>=2.14",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
